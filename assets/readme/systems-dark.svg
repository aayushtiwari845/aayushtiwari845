      <text x="136" y="210" text-anchor="middle" fill="#9da7aa">API</text>
      <text x="204" y="210" text-anchor="middle" fill="#9da7aa">SERVICE</text>
      <text x="274" y="210" text-anchor="middle" fill="#9da7aa">STATE</text>
    </g>
    <rect x="344" y="185" width="10" height="10" transform="rotate(45 349 190)" fill="#0c1012" stroke="#56dff3"/>
  </g>

  <g>
    <circle cx="450" cy="190" r="4" fill="#07090a" stroke="#56dff3" stroke-width="1.5"/>
    <rect x="496" y="158" width="205" height="64" rx="5" fill="#101619" stroke="#394448"/>
    <path d="M514 176H683M514 190H683M514 204H683" stroke="#313c40"/>
    <path d="M530 176H570L586 190H626L642 204H678" fill="none" stroke="#56dff3" stroke-width="1.2"/>
