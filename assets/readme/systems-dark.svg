    <path d="M446 190H496" stroke="#526064" stroke-width="1.5" marker-end="url(#dark-arrow)"/>
    <path d="M701 190H818" stroke="#56dff3" stroke-width="1.5" marker-end="url(#dark-arrow)">
      <animate attributeName="stroke-opacity" values="0.42;1;0.42" dur="5.8s" begin="-2.9s" repeatCount="indefinite"/>
    </path>
    <path d="M838 190H888" stroke="#526064" stroke-width="1.5" marker-end="url(#dark-arrow)"/>
    <path d="M1093 190H1146" stroke="#7d9852" stroke-width="1.5" marker-end="url(#dark-arrow)"/>
  </g>

