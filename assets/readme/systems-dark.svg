<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="systems-dark-title systems-dark-desc">
  <title id="systems-dark-title">Living systems operating model</title>
  <desc id="systems-dark-desc">An animated technical diagram showing a request moving through connected Systems, Data, and Intelligence regions before becoming an evidence-backed decision.</desc>
  <defs>
    <pattern id="dark-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#242c2f" stroke-width="0.6" opacity="0.48"/>
    </pattern>
    <linearGradient id="dark-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1315"/>
      <stop offset="1" stop-color="#0a0d0f"/>
    </linearGradient>
    <linearGradient id="dark-signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56dff3" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#56dff3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b9ef61" stop-opacity="0.28"/>
    </linearGradient>
    <marker id="dark-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4 0 8Z" fill="#56dff3"/>
    </marker>
  </defs>

  <rect width="1200" height="340" fill="#07090a"/>
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="#20272a" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="300" fill="url(#dark-grid)" opacity="0.48"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="42" fill="#56dff3" font-size="10" font-weight="700" letter-spacing="2.4">OPERATING MODEL / 01</text>
    <text x="40" y="61" fill="#8e999d" font-size="9" letter-spacing="1.1">FROM REQUEST TO GROUNDED EVIDENCE</text>
    <circle cx="1008" cy="44" r="3.5" fill="#b9ef61"/>
    <circle cx="1008" cy="44" r="7" fill="none" stroke="#b9ef61" stroke-opacity="0.24"/>
    <text x="1022" y="48" fill="#b7c0c2" font-size="9" letter-spacing="1.4">STATE / COMPOSABLE</text>
    <path d="M40 72H1160" stroke="#252d30"/>
  </g>

  <g>
    <rect x="36" y="88" width="344" height="190" rx="8" fill="url(#dark-panel)" stroke="#2b3437"/>
    <path d="M36 106V88H54M362 88H380V106M36 260V278H54" fill="none" stroke="#56dff3" stroke-width="1.5"/>
    <rect x="428" y="88" width="344" height="190" rx="8" fill="url(#dark-panel)" stroke="#2b3437"/>
    <path d="M428 106V88H446M754 88H772V106" fill="none" stroke="#56dff3" stroke-width="1.5" opacity="0.8"/>
    <rect x="820" y="88" width="344" height="190" rx="8" fill="url(#dark-panel)" stroke="#2b3437"/>
    <path d="M820 106V88H838M1146 278H1164V260M1146 88H1164V106" fill="none" stroke="#b9ef61" stroke-width="1.5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="58" y="116" fill="#707c80" font-size="9" letter-spacing="1.8">REGION 01</text>
    <text x="58" y="144" fill="#eef3f3" font-size="20" font-weight="700" letter-spacing="2.4">SYSTEMS</text>
    <text x="358" y="116" text-anchor="end" fill="#b9ef61" font-size="8" letter-spacing="1.2">BOUNDARIES / CLEAR</text>

    <text x="450" y="116" fill="#707c80" font-size="9" letter-spacing="1.8">REGION 02</text>
    <text x="450" y="144" fill="#eef3f3" font-size="20" font-weight="700" letter-spacing="2.4">DATA</text>
    <text x="750" y="116" text-anchor="end" fill="#b9ef61" font-size="8" letter-spacing="1.2">LINEAGE / VISIBLE</text>

    <text x="842" y="116" fill="#707c80" font-size="9" letter-spacing="1.8">REGION 03</text>
    <text x="842" y="144" fill="#eef3f3" font-size="20" font-weight="700" letter-spacing="2.4">INTELLIGENCE</text>
    <text x="1142" y="116" text-anchor="end" fill="#b9ef61" font-size="8" letter-spacing="1.2">DECISIONS / GROUNDED</text>
  </g>

