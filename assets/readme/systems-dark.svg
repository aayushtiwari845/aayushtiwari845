    <circle cx="586" cy="190" r="3" fill="#07090a" stroke="#56dff3"/>
    <circle cx="642" cy="204" r="3" fill="#b9ef61"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" letter-spacing="0.9">
