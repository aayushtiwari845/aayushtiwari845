      <text x="580" y="216" fill="#9da7aa">FLOW</text>
      <text x="655" y="216" fill="#9da7aa">STORE</text>
    </g>
    <rect x="736" y="185" width="10" height="10" transform="rotate(45 741 190)" fill="#0c1012" stroke="#56dff3"/>
  </g>

  <g>
    <circle cx="842" cy="190" r="4" fill="#07090a" stroke="#56dff3" stroke-width="1.5"/>
    <rect x="888" y="158" width="205" height="64" rx="5" fill="#101619" stroke="#394448"/>
    <path d="M916 178L958 190 916 205M958 190L1003 176M958 190L1003 206M1003 176V206M1003 190H1067" fill="none" stroke="#526064"/>
    <circle cx="916" cy="178" r="5" fill="#0c1012" stroke="#56dff3"/>
    <circle cx="916" cy="205" r="5" fill="#0c1012" stroke="#56dff3"/>
    <circle cx="958" cy="190" r="6" fill="#101619" stroke="#b9ef61"/>
    <circle cx="1003" cy="176" r="4" fill="#56dff3"/>
    <circle cx="1003" cy="206" r="4" fill="#56dff3"/>
    <path d="M1040 181H1070M1040 190H1062M1040 199H1074" stroke="#9da7aa"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" letter-spacing="0.8">
      <text x="905" y="217" fill="#9da7aa">CONTEXT</text>
      <text x="947" y="217" fill="#9da7aa">POLICY</text>
      <text x="1035" y="217" fill="#9da7aa">EVIDENCE</text>
    </g>
    <rect x="1128" y="185" width="10" height="10" transform="rotate(45 1133 190)" fill="#0c1012" stroke="#b9ef61"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="1.25">
    <text x="58" y="254" fill="#707c80">INTERFACES · SERVICES · RECOVERY</text>
    <text x="450" y="254" fill="#707c80">STREAMS · QUALITY · DURABLE STATE</text>
    <text x="842" y="254" fill="#707c80">RETRIEVAL · POLICY · EVALUATION</text>
  </g>

  <g fill="none">
    <path d="M40 302H1160" stroke="#252d30"/>
    <path d="M40 302H1160" stroke="url(#dark-signal)" stroke-width="1.5" stroke-dasharray="2 12"/>
    <path d="M40 298V306M380 298V306M428 298V306M772 298V306M820 298V306M1160 298V306" stroke="#394448"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="1.4">
    <text x="40" y="319" fill="#707c80">REQUEST</text>
    <text x="1160" y="319" text-anchor="end" fill="#8fae5b">VERIFIABLE OUTPUT</text>
  </g>

  <g>
    <circle r="4" fill="#56dff3">
      <animateMotion path="M58 190H1140" dur="12s" begin="-2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="12s" begin="-2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#b9ef61">
      <animateMotion path="M58 190H1140" dur="12s" begin="-8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.95;1" dur="12s" begin="-8.5s" repeatCount="indefinite"/>
