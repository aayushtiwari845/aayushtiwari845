    <path d="M128 176V170M128 192V186M123 181H117M139 181H133" stroke="#56dff3" stroke-width="1"/>
    <rect x="194" y="176" width="20" height="11" rx="2" fill="none" stroke="#8e999d"/>
    <path d="M198 181.5H210" stroke="#b9ef61"/>
    <path d="M264 174H285V188H264ZM268 178H281M268 183H278" fill="none" stroke="#8e999d"/>
